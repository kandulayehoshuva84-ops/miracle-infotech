<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIRACLE INFOTECH</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#142033}*{box-sizing:border-box}button,input,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f1d35,#315982)}.card{background:white;padding:40px;border-radius:24px;width:380px;text-align:center}.card input,.card button{width:100%;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #d8e0ea}.card button,.primary{background:#17365f;color:white;border:0;font-weight:bold}.app{min-height:100vh}.header{height:80px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;padding:0 28px}.brand{font-size:22px;font-weight:900}.top{display:flex;gap:18px;align-items:center}.content{padding:24px 30px}.search{background:#fff;padding:12px;border:1px solid #ddd;border-radius:12px;margin-bottom:20px}.search input{width:90%;border:0;outline:0}.stats,.services,.subs{display:grid;gap:14px}.stats{grid-template-columns:repeat(5,1fr)}.services{grid-template-columns:repeat(4,1fr)}.subs{grid-template-columns:repeat(3,1fr)}.box{background:#fff;border:1px solid #e0e6ef;border-radius:16px;padding:20px}.icon{font-size:30px}.box button{width:100%;border:0;background:transparent;text-align:left}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav button{padding:10px 14px;border:1px solid #dce3ec;background:#fff;border-radius:10px}.form{background:#fff;padding:24px;border-radius:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:850px}.form label{display:grid;gap:6px;font-size:12px}.form input,.form select{padding:12px;border:1px solid #d8e0ea;border-radius:10px}.table{background:#fff;border-radius:14px;overflow:auto}.row{display:grid;grid-template-columns:1.3fr 1.5fr .6fr 1fr 1.2fr;gap:12px;padding:14px;border-bottom:1px solid #eee;min-width:700px}.muted{color:#7d8a9d;font-size:12px}footer{padding:12px 28px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-between;font-size:11px;color:#77849a}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.services,.subs,.form{grid-template-columns:1fr 1fr}}@media(max-width:600px){.header{height:auto;padding:14px}.top .clock{display:none}.content{padding:14px}.services,.subs,.form{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><div id="root"></div><script>
const services=[['🪪','Aadhaar',['Aadhaar Update','Address Update','Mobile Update','Name Correction','DOB Correction','Download Aadhaar'],'https://myaadhaar.uidai.gov.in/',50],['💳','PAN Card',['New PAN Application','PAN Correction','PAN Download'],'https://www.pan.utiitsl.com/',100],['🗳️','Voter Card',['New Voter Registration','Voter Correction','Download e-EPIC'],'https://voters.eci.gov.in/',50],['🚗','Driving Licence',['Learner Licence','DL Renewal','DL Services'],'https://sarathi.parivahan.gov.in/',150]];
const users={master:'Master',admin:'Admin',employee:'Employee'};let user=localStorage.miUser?JSON.parse(localStorage.miUser):null,apps=JSON.parse(localStorage.miApps||'[]'),section='dashboard',selected=null,now=new Date(),idle=0;
function login(){let u=document.getElementById('u').value.toLowerCase(),p=document.getElementById('p').value;if(!users[u]||p!=='1234')return alert('Demo: Master/Admin/Employee, password 1234');let last=localStorage['last_'+users[u]]||'First login';localStorage['last_'+users[u]]=new Date().toLocaleString('en-IN');user={name:users[u],last};localStorage.miUser=JSON.stringify(user);render()}
function logout(){localStorage.removeItem('miUser');user=null;render()}function go(s,x=null){section=s;selected=x;render()}function save(){localStorage.miApps=JSON.stringify(apps)}
function render(){if(!user){root.innerHTML='<div class="login"><div class="card"><div class="icon">Ⓜ️</div><h1>MIRACLE INFOTECH</h1><p class="muted">Internet Center Management Portal</p><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Sign In</button><p class="muted">Demo: Master / Admin / Employee · 1234</p></div></div>';return}let t=now.toLocaleTimeString('en-IN'),d=now.toLocaleDateString('en-IN');let stats=['Total Applications','Received','Processed','Pending','Completed'];let counts=[apps.length,...['Received','Processed','Pending','Completed'].map(s=>apps.filter(a=>a.status===s).length)];root.innerHTML='<div class="app"><header class="header"><div><div class="brand">MIRACLE INFOTECH</div><small class="muted">INTERNET CENTER</small></div><div class="top"><div><b>👤 '+user.name+'</b><br><small class="muted">'+user.last+'</small></div><div class="clock">📅 '+d+'<br>⏰ <b>'+t+'</b></div><button onclick="logout()">Logout</button></div></header><main class="content"><div class="nav"><button onclick="go(\'dashboard\')">🏠 Dashboard</button><button onclick="go(\'create\')">➕ Create Application</button><button onclick="go(\'applications\')">✏️ Application Modification</button>'+services.map((s,i)=>'<button onclick="go(\'service\','+i+')">'+s[0]+' '+s[1]+'</button>').join('')+'</div><div class="search">🔎 <input id="search" placeholder="Search applications, customer, mobile, work..." oninput="renderTable()"></div><div id="view"></div></main><footer><span>🛡️ Secure workspace</span><span>Auto logout after 20 minutes of inactivity</span></footer></div>';view();}
function view(){let v=document.getElementById('view');if(section==='dashboard'){v.innerHTML='<h2>Welcome, '+user.name+'</h2><p class="muted">Manage your internet center applications from one place.</p><div class="stats">'+stats.map((x,i)=>'<div class="box"><span class="muted">'+x+'</span><h2>'+counts[i]+'</h2></div>').join('')+'</div><h3>Services</h3><div class="services">'+services.map((s,i)=>'<button class="box" onclick="go(\'service\','+i+')"><div class="icon">'+s[0]+'</div><h3>'+s[1]+'</h3><span class="muted">'+s[2].length+' sub-services</span> →</button>').join('')+'</div><h3>Recent Applications</h3><div id="tbl"></div>';renderTable()}else if(section==='service'){let s=services[selected];v.innerHTML='<h2>'+s[0]+' '+s[1]+'</h2><p class="muted">Select a sub-work to enter its URL.</p><div class="subs">'+s[2].map(x=>'<button class="box" onclick="window.open(\''+s[3]+'\',\'_blank\')"><div class="icon">'+s[0]+'</div><b>'+x+'</b><br><span class="muted">Open service URL ↗</span></button>').join('')+'</div>'}else if(section==='create'){v.innerHTML='<h2>Create Application</h2><form class="form" onsubmit="create(event)"><label>Customer Name<input id="cn" required></label><label>Mobile Number<input id="mn" required maxlength="10"></label><label>Work<select id="wk" required onchange="setSubs()"><option value="">Select work</option>'+services.map(s=>'<option>'+s[1]+'</option>').join('')+'</select></label><label>Sub-work<select id="sw" required><option value="">Select sub-work</option></select></label><label>Default / Service Fee<input id="fee" type="number" min="0" value=""></label><div><button class="primary">Create Application</button></div></form>'}else{v.innerHTML='<h2>Application Modification</h2><p class="muted">Search and update application status.</p><div id="tbl"></div>';renderTable()}}
function setSubs(){let s=services.find(x=>x[1]===wk.value);sw.innerHTML='<option value="">Select sub-work</option>'+s[2].map(x=>'<option>'+x+'</option>').join('');fee.value=s[4]}
function create(e){e.preventDefault();apps.unshift({id:Date.now(),customer:cn.value,mobile:mn.value,work:wk.value,sub:sw.value,fee:Number(fee.value||0),status:'Received',created:new Date().toLocaleString('en-IN')});save();go('dashboard')}
function renderTable(){let el=document.getElementById('tbl');if(!el)return;let q=(document.getElementById('search')?.value||'').toLowerCase(),a=apps.filter(x=>(x.customer+x.mobile+x.work+x.sub).toLowerCase().includes(q));el.innerHTML='<div class="table"><div class="row"><b>Customer</b><b>Work / Sub-work</b><b>Fee</b><b>Status</b><b>Created</b></div>'+a.map(x=>'<div class="row"><div><b>'+x.customer+'</b><br><span class="muted">'+x.mobile+'</span></div><div><b>'+x.work+'</b><br><span class="muted">'+x.sub+'</span></div><div>₹'+x.fee+'</div><div><select onchange="status('+x.id+',this.value)"><option '+(x.status==='Received'?'selected':'')+'>Received</option><option '+(x.status==='Processed'?'selected':'')+'>Processed</option><option '+(x.status==='Pending'?'selected':'')+'>Pending</option><option '+(x.status==='Completed'?'selected':'')+'>Completed</option></select></div><div>'+x.created+'</div></div>').join('')+'</div>'}function status(id,s){apps=apps.map(x=>x.id===id?{...x,status:s}:x);save();render()}
setInterval(()=>{now=new Date();if(user){idle++;if(idle>=1200)logout();else{let c=document.querySelector('.clock');if(c)c.innerHTML='📅 '+now.toLocaleDateString('en-IN')+'<br>⏰ <b>'+now.toLocaleTimeString('en-IN')+'</b>'}}},1000);['mousemove','keydown','click','scroll','touchstart'].forEach(e=>addEventListener(e,()=>idle=0));render();
</script></body></html>
